name: Build and publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-demo
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm exec -- vitest run --environment jsdom

      - name: Build with mock data
        env:
          VITE_API_MODE: mock
          PAGES_REPOSITORY: ${{ vars.PAGES_REPOSITORY }}
        run: |
          : "${PAGES_REPOSITORY:?Set the PAGES_REPOSITORY repository variable}"
          npm run build -- --base "/${PAGES_REPOSITORY##*/}/"

      - name: Send the built site to the Pages repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: ${{ vars.PAGES_REPOSITORY }}
          publish_branch: main
          publish_dir: web/dist
          destination_dir: site
          disable_nojekyll: true
          full_commit_message: Publish demo from ${{ github.sha }}
