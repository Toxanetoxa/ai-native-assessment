services:
  db:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
      - --default-time-zone=+03:00
      - --innodb-buffer-pool-size=64M
    environment:
      MYSQL_DATABASE: assessment
      MYSQL_USER: assessment
      MYSQL_PASSWORD: assessment_local
      MYSQL_ROOT_PASSWORD: assessment_root_local
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -Nse 'SELECT 1 FROM dataset_metadata WHERE id=1'"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 40

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_DSN: assessment:assessment_local@tcp(db:3306)/assessment
      LISTEN_ADDR: :8081
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/server, healthcheck]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  mysql_data:
